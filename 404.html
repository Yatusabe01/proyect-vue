<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/proyect-vue/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Proyecto SPA - Vue 3</title>
    <script type="text/javascript">
      // Redirección para GitHub Pages SPA
      var pathSegmentsToKeep = 1;
      var l = window.location;
      var repoBase = '/' + l.pathname.split('/')[1];
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        repoBase + '/?p=/' + l.pathname.slice(repoBase.length).replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
